services:
  postgres:
    image: postgres:16-alpine
    container_name: campaignhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campaignhub
      POSTGRES_USER: campaignhub
      POSTGRES_PASSWORD: campaignhub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - campaignhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaignhub -d campaignhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campaignhub_pgdata:
